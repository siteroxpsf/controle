<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Cartões</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:20px;
        }

        .container{
            max-width:1400px;
            margin:auto;
        }

        .card{
            background:white;
            border-radius:10px;
            padding:20px;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        h1,h2{
            margin-bottom:20px;
        }

        .grid{
            display:grid;
            grid-template-columns:
                2fr
                1fr
                1fr
                1fr
                1fr;
            gap:15px;
            align-items:end;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .btn-add{
            background:#28a745;
            color:white;
            margin-top:15px;
        }

        .btn-voltar{
            background:#007bff;
            color:white;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table th{
            background:#f1f1f1;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        @media(max-width:900px){

            .grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <button
        class="btn-voltar"
        onclick="window.location.href='index.html'">
        ← Voltar ao Financeiro
    </button>

    <div class="card">

        <h1>💳 Controle de Cartões</h1>

        <div class="grid">

            <div>
                <label>Descrição</label>
                <input type="text" id="descricao">
            </div>

            <div>
                <label>Valor Total</label>
                <input type="number" id="valor">
            </div>

            <div>
                <label>Cartão</label>

                <select id="cartao">
                    <option>Nubank</option>
                    <option>Mercado Pago</option>
                    <option>Inter</option>
                    <option>PicPay</option>
                </select>

            </div>

            <div>
                <label>Parcelas</label>

                <select id="parcelas">

                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                    <option value="4">4x</option>
                    <option value="5">5x</option>
                    <option value="6">6x</option>
                    <option value="7">7x</option>
                    <option value="8">8x</option>
                    <option value="9">9x</option>
                    <option value="10">10x</option>
                    <option value="11">11x</option>
                    <option value="12">12x</option>

                </select>

            </div>

            <div>
                <label>Data da Compra</label>
                <input type="date" id="dataCompra">
            </div>

        </div>

        <button
            class="btn-add"
            onclick="salvarCompra()">
            Salvar Compra
        </button>

    </div>

    <div class="card">

        <h2>Parcelas Geradas</h2>

        <table>

            <thead>

                <tr>

                    <th>Descrição</th>
                    <th>Cartão</th>
                    <th>Parcela</th>
                    <th>Vencimento</th>
                    <th>Valor</th>

                </tr>

            </thead>

            <tbody id="tabelaParcelas"></tbody>

        </table>

    </div>

</div>

<script>

let comprasCartao =
JSON.parse(localStorage.getItem("comprasCartao")) || [];

renderizar();

function salvarCompra(){

    let descricao =
    document.getElementById("descricao").value;

    let valor =
    parseFloat(document.getElementById("valor").value);

    let cartao =
    document.getElementById("cartao").value;

    let parcelas =
    parseInt(document.getElementById("parcelas").value);

    let data =
    new Date(document.getElementById("dataCompra").value);

    if(!descricao || !valor || !data){

        alert("Preencha todos os campos");
        return;

    }

    let valorParcela =
    valor / parcelas;

    for(let i=0; i<parcelas; i++){

        let vencimento =
        new Date(data);

        vencimento.setMonth(
            vencimento.getMonth() + i
        );

        comprasCartao.push({

            descricao:descricao,

            cartao:cartao,

            parcela:(i+1)+"/"+parcelas,

            data:vencimento
                .toISOString()
                .split('T')[0],

            valor:valorParcela.toFixed(2)

        });

    }

    localStorage.setItem(
        "comprasCartao",
        JSON.stringify(comprasCartao)
    );

    limparCampos();

    renderizar();

    alert("Compra salva com sucesso!");

}

function renderizar(){

    let tabela =
    document.getElementById("tabelaParcelas");

    tabela.innerHTML = "";

    comprasCartao.forEach(item=>{

        tabela.innerHTML += `

        <tr>

            <td>${item.descricao}</td>
            <td>${item.cartao}</td>
            <td>${item.parcela}</td>
            <td>${formatarData(item.data)}</td>
            <td>
                R$ ${Number(item.valor)
                    .toLocaleString('pt-BR',{
                        minimumFractionDigits:2
                    })}
            </td>

        </tr>

        `;

    });

}

function formatarData(data){

    let d = new Date(data);

    return d.toLocaleDateString('pt-BR');

}

function limparCampos(){

    document.getElementById("descricao").value="";
    document.getElementById("valor").value="";
    document.getElementById("parcelas").value="1";

}

</script>

</body>

</html>
