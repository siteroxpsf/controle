<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro Familiar PRO</title>

    <link rel="stylesheet" href="css/estilo.css">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="container">

        <h1>
            💰 Controle Financeiro Familiar PRO 1.1
        </h1>

        <!-- RESUMO -->
        <div class="card">

            <h2>Resumo Financeiro</h2>

            <div class="resumo">

                <div class="box entrada">
                    Receitas<br>
                    R$ <span id="totalReceitas">0.00</span>
                </div>

                <div class="box saida">
                    Despesas<br>
                    R$ <span id="totalDespesas">0.00</span>
                </div>

                <div class="box cartao">
                    Cartões<br>
                    R$ <span id="totalCartoes">0.00</span>
                </div>

                <div class="box saldo">
                    Saldo<br>
                    R$ <span id="saldoFinal">0.00</span>
                </div>

            </div>

        </div>

        <!-- FORM -->
        <div class="card">

            <h2>Novo Lançamento</h2>

            <div class="grid">

                <div>
                    <label>Descrição</label>
                    <input type="text" id="descricao">
                </div>

                <div>
                    <label>Valor</label>
                    <input type="number" id="valor">
                </div>

                <div>
                    <label>Categoria</label>

                    <select id="categoria">

                        <option>Receita</option>

                        <option>Despesa Fixa</option>

                        <option>Despesa Variável</option>

                    </select>

                </div>

                <div>
                    <label>Data</label>
                    <input type="date" id="data">
                </div>

            </div>
//botoes
            <button
                class="btn-add"
                id="btnAdicionar">
                Adicionar
            </button>

            <button
                class="btn-cartao"
                id="btnAbrirCartao">
                Despesa de Cartão
            </button>

            <button
                class="btn-pdf"
                id="btnPDF">
                Gerar PDF
            </button>

            <button
                class="btn-dark"
                id="btnDark">
                Dark Mode
            </button>

            <button
                class="btn-limpar"
                id="btnLimpar">
                Limpar Campos
            </button>

            <button
                 class="btn-cartao"
                 onclick="window.location.href='cartoes.html'">
                 Gerenciar Cartões
            </button>

        </div>
        //fim botoes

        <!-- TABELA -->

        <div class="card">

            <h2>Lançamentos</h2>

            <table>

                <thead>

                    <tr>

                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Ação</th>

                    </tr>

                </thead>

                <tbody id="tabelaLancamentos"></tbody>

            </table>

        </div>

        <!-- GRÁFICO -->

        <div class="card">

            <h2>Gráfico Financeiro</h2>

            <canvas id="grafico"></canvas>

        </div>

    </div>

    <!-- MODAL CARTÃO -->

    <div class="modal" id="modalCartao">

        <div class="modal-content">

            <h2>💳 Compras Cartão</h2>

            <div class="grid">

                <div>
                    <label>Descrição</label>
                    <input type="text" id="cartaoDescricao">
                </div>

                <div>
                    <label>Valor</label>
                    <input type="number" id="cartaoValor">
                </div>

                <div>
                    <label>Cartão</label>

                    <select id="cartaoNome">

                        <option>Cartão Nubank</option>
                        <option>Cartão MercadoPago</option>

                    </select>

                </div>

                <div>
                    <label>Parcelas</label>
                    <input type="number"
                        id="parcelas"
                        value="1">
                </div>

                <div>
                    <label>Data</label>
                    <input type="date"
                        id="cartaoData">
                </div>

            </div>

            <button
                class="btn-add"
                id="btnSalvarCartao">
                Salvar Compra
            </button>

            <button
                class="btn-limpar"
                id="btnFecharCartao">
                Fechar
            </button>

            <table>

                <thead>

                    <tr>

                        <th>Descrição</th>
                        <th>Cartão</th>
                        <th>Parcelas</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Ação</th>

                    </tr>

                </thead>

                <tbody id="tabelaCartao"></tbody>

            </table>

        </div>

    </div>

    <script type="module" src="js/app.js"></script>

</body>

</html>
